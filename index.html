<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Test API Agnes</title>
<style>
body { font-family: sans-serif; padding: 20px; background: #fdf8f0; text-align: center; }
button { padding: 15px; font-size: 18px; background: #e8a87c; color: white; border: none; border-radius: 8px; cursor: pointer; margin-top: 20px; }
#log { margin-top: 20px; font-family: monospace; white-space: pre-wrap; text-align: left; background: #fff; padding: 10px; border-radius: 8px; }
#img-container img { width: 100%; max-width: 400px; border-radius: 8px; margin-top: 20px; border: 2px solid #ccc; }
</style>
</head>
<body>

<h1>Test de l'API</h1>
<p>Colle ta clé API :</p>
<input type="text" id="key" placeholder="sk-..." style="padding: 10px; width: 80%; max-width: 400px;">
<br>
<button onclick="testImage()">Tester la génération d'image</button>

<div id="log"></div>
<div id="img-container"></div>

<script>
async function testImage() {
const key = document.getElementById('key').value.trim();
const log = document.getElementById('log');
log.textContent = "Envoi de la requête...\n";

try {
const res = await fetch('https://apihub.agnes-ai.com/v1/images/generations', {
method: 'POST',
headers: {
'Authorization': 'Bearer ' + key,
'Content-Type': 'application/json'
},
body: JSON.stringify({
model: 'agnes-image-2.1-flash',
prompt: 'Un chaton mignon dans un décor pastel de conte de fées',
n: 1,
size: '1K',
ratio: '16:9'
})
});

const data = await res.json();

if (!res.ok) {
log.textContent += "ERREUR : " + JSON.stringify(data, null, 2);
return;
}

log.textContent += "SUCCÈS ! L'image a été générée.\n";

const imgUrl = data.data[0].url;
document.getElementById('img-container').innerHTML = '<img src="' + imgUrl + '">';

} catch (e) {
log.textContent += "Erreur fatale : " + e.message;
}
}
</script>
</body>
</html>
